name: release

# Tag-triggered: push a `v*.*.*` tag to cut a real release with attached
# binaries. `workflow_dispatch` exists only to test the build matrix
# without publishing anything (see the `if` guard on the release step).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# This repo's default GITHUB_TOKEN permissions are read-only; the release
# step needs contents:write to create a release and attach assets to it.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deliberately just the two "-latest" runner images, not every
          # OS/arch combination GitHub hosts: macos-13 (Intel) sat queued
          # for 9+ minutes waiting for a runner while every other job in
          # the same run finished in under 3 — not worth the wait for a
          # release pipeline. macos-latest is Apple Silicon today, which
          # is also just the more relevant target now.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p forkyard

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/forkyard dist/forkyard
          tar -czf forkyard-${{ matrix.target }}.tar.gz -C dist forkyard
          shasum -a 256 forkyard-${{ matrix.target }}.tar.gz > forkyard-${{ matrix.target }}.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: forkyard-${{ matrix.target }}
          path: |
            forkyard-${{ matrix.target }}.tar.gz
            forkyard-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            forkyard-${{ matrix.target }}.tar.gz
            forkyard-${{ matrix.target }}.tar.gz.sha256
