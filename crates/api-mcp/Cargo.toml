[package]
name = "forkyard-api-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
eyre = "0.6.14"
forkyard-session = { version = "0.1.0", path = "../session" }
revm.workspace = true
rmcp = { version = "3.1.4", features = ["transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
rmcp = { version = "3.1.4", features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = "1.0.151"
