[package]
name = "forkyard-api-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eyre = "0.6.14"
forkyard-session = { version = "0.1.0", path = "../session" }
revm.workspace = true
rmcp = { version = "3.1.4", features = ["transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
rmcp = { version = "3.1.4", features = ["client"] }
serde_json = "1.0.151"
