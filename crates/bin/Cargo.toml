[package]
name = "forkyard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dotenvy = "0.15.7"
forkyard-api-http = { version = "0.1.0", path = "../api-http" }
forkyard-api-mcp = { version = "0.1.0", path = "../api-mcp" }
forkyard-engine = { version = "0.1.0", path = "../engine" }
forkyard-fetch = { version = "0.1.0", path = "../fetch" }
forkyard-ingest = { version = "0.1.0", path = "../ingest" }
forkyard-session = { version = "0.1.0", path = "../session" }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
