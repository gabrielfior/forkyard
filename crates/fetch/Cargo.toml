[package]
name = "forkyard-fetch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy-network = "=2.3.0"
alloy-provider = { version = "=2.3.0", features = ["reqwest"] }
eyre = "0.6.14"
foundry-fork-db = "0.27.0"
revm = "41.0.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
alloy-consensus = "=2.3.0"
alloy-primitives = "1.6.1"
alloy-signer = "=2.3.0"
alloy-signer-local = "=2.3.0"
dotenvy = "0.15.7"
forkyard-engine = { path = "../engine" }
