[package]
name = "forkyard-fetch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy-network = "=2.3.0"
alloy-provider = { version = "=2.3.0", features = ["reqwest"] }
alloy-rpc-client = "2.4.1"
alloy-rpc-types = "=2.3.0"
dashmap = "6.2.1"
eyre = "0.6.14"
forkyard-engine = { version = "0.1.0", path = "../engine" }
foundry-fork-db = "0.27.0"
# Not used directly: turns on HTTP/2 for the reqwest alloy's transport
# already uses, which alloy builds without it. Over HTTP/1.1 a burst of N
# concurrent misses dials N TLS connections (measured: 50 agents opening at
# once dialed 50); over HTTP/2 they share one warm connection.
reqwest = { version = "0.13.4", default-features = false, features = ["http2"] }
revm.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
serde_json = "1.0.151"
alloy-consensus = "=2.3.0"
alloy-primitives = "1.6.1"
alloy-signer = "=2.3.0"
alloy-signer-local = "=2.3.0"
dotenvy = "0.15.7"
