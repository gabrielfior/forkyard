[project]
name = "forkyard-benchmarks"
version = "0.1.0"
description = "Multi-agent fork benchmark: forkyard (one process, N sessions) vs. Anvil (N processes)"
requires-python = ">=3.11.9"
dependencies = [
    "web3>=7.16.0",
    # Imported directly by actions.py / agent.py / backend.py, so declared
    # explicitly rather than relied on as web3's transitive deps.
    "eth-account>=0.13.0",
    "eth-utils>=5.0.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]